<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic AI - Advising</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="style.css?v=2">
</head>

<body>

  <!-- ======================= Header ======================= -->
  <header class="header">
    <div class="header__left">
      <a href="index.html" class="brand" aria-label="Academic AI home">
        <div class="brand__logo">
          <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewBox="0 0 24 24">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
          </svg>
        </div>
        <span class="brand__name">Academic AI</span>
      </a>
      <nav class="nav-links" aria-label="Main">
        <a href="../chatbot-page/index.html?v=2" class="nav-link">Open chatbot</a>
        <a href="../admin-page/index.html?v=2" class="nav-link" id="admin-link" hidden>Admin console</a>
      </nav>
    </div>

    <div class="header__right">
      <div class="user">
        <div class="user__avatar">?</div>
        <div class="user__info">
          <div class="user__name">Loading</div>
          <div class="user__id"></div>
        </div>
        <button type="button" id="sign-out-btn" class="sign-out" title="Sign out" aria-label="Sign out">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ======================= Layout ======================= -->
  <main class="layout" id="layout">

    <!-- Student list -->
    <aside class="list-pane" id="list-pane" aria-label="Students">
      <div class="list-pane__head">
        <h1 class="list-pane__title">Students</h1>
        <span class="muted" id="student-count"></span>
      </div>
      <label class="visually-hidden" for="search">Search students by name or ID</label>
      <input type="search" id="search" class="input" placeholder="Search by name or ID" autocomplete="off">
      <div id="list-status" class="status" role="status"></div>
      <ul class="student-list" id="student-list"></ul>
    </aside>

    <!-- Detail -->
    <section class="detail-pane" id="detail-pane" aria-live="polite">
      <button type="button" class="back-btn" id="back-btn">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="14" height="14"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
        Back to students
      </button>
      <div id="detail"></div>
    </section>
  </main>

  <!-- ======================= Footer ======================= -->
  <footer class="footer">
    <span>Student messages in the chatbot are private to the student.</span>
  </footer>

  <script src="../shared/auth.js?v=2"></script>
  <script src="script.js?v=2"></script>
</body>
</html>
