[project]
name = "SmartAcademicSystem"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
 "python-dotenv>=1.0.0,<2.0.0",
 "pydantic>=2.11.5",
 "aiostream>=0.5.2,<0.6.0",
 "llama-index-core>=0.14.0,<0.15.0",
 "llama-index-readers-file>=0.4.6,<1.0.0",
 "llama-index-indices-managed-llama-cloud>=0.6.3,<1.0.0",
 "docx2txt>=0.8,<0.9",
 "llama-index-llms-ollama>=0.9.0,<1.0.0",
 "llama-index-llms-openai-like>=0.8.0,<1.0.0",
 "llama-index-embeddings-ollama>=0.9.0,<1.0.0",
 "fastapi>=0.115.0,<1.0.0",
 "uvicorn[standard]>=0.30.0,<1.0.0",
 "pyngrok>=7.0.0,<8.0.0",
 "llama-index-vector-stores-postgres>=0.9.0,<1.0.0",
 "psycopg2-binary>=2.9.0,<3.0.0",
 "asyncpg>=0.29.0,<1.0.0",
 "pymupdf>=1.28.0,<2.0.0",
 "easyocr>=1.7.0,<2.0.0",
 "pdfplumber>=0.11.0,<1.0.0",
]

[project.optional-dependencies]
dev = [ "mypy>=1.8.0,<2.0.0", "pytest>=8.3.5,<9.0.0", "pytest-asyncio>=0.25.3,<0.26.0" ]

[project.scripts]
generate = "src.generate:generate_index"

[tool]
[tool.mypy]
python_version = "3.11"
plugins = "pydantic.mypy"
exclude = [ "tests", "venv", ".venv", "output", "config" ]
check_untyped_defs = true
warn_unused_ignores = false
show_error_codes = true
namespace_packages = true
ignore_missing_imports = true
follow_imports = "silent"
implicit_optional = true
strict_optional = false
disable_error_code = [ "return-value", "assignment" ]

[[tool.mypy.overrides]]
module = "src.*"
ignore_missing_imports = false

[tool.hatch]
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
[tool.hatch.build.targets]
[tool.hatch.build.targets.wheel]
packages = [ "src" ]

[build-system]
requires = [ "hatchling>=1.24" ]
build-backend = "hatchling.build"
